# Config KataGo — scan rapide (batch)
# Charge GPU : ~120-300 visits/s → 400 visits ≈ 1,5-3 s/coup

logDir = E:/lizzie/analysis_logs_goprogress
reportAnalysisWinratesAs = BLACK
conservativePass = true

maxVisits = 400
# RTX 3060 — un seul moteur, gros batches pour saturer le GPU entre les coups
numAnalysisThreads = 1
