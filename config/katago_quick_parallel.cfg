# Config KataGo — quick en pipeline parallele (2 moteurs sur RTX 3060 12 Go)
# Cache et batch reduits pour laisser de la place au moteur fuseki/deep.

logDir = E:/lizzie/analysis_logs_goprogress
reportAnalysisWinratesAs = BLACK
conservativePass = true

maxVisits = 400
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true

cudaDeviceToUse = 0
cudaUseFP16 = true
cudaUseNHWC = true
