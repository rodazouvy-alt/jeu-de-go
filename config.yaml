# Configuration Analyse & Progression Go
# Tout est local — rien ne part sur internet sauf la sync KGS.

player:
  kgs_username: Rodolphe
  rank: 3d
  color_preference: both  # analyser les coups des deux couleurs

katago:
  executable: E:/lizzie/katago.exe
  model: E:/lizzie/KataGo28b.gz
  config: config/katago_quick.cfg
  deep_config: config/katago_deep.cfg
  working_dir: E:/lizzie
  startup_wait_seconds: 30
  num_analysis_threads: 8
  # Débit réel : ~600 visits/s à vide, ~120-300 visits/s si séquences en cours
  visits_per_second: 200
  visits_per_second_idle: 600
  # Pass 1 — scan de masse (~2 s/coup en charge)
  quick_max_visits: 400
  # Pass 2 — coups suspects (~20 s en charge, qualité ~9d)
  deep_max_visits: 4000
  # Méga-blunders (~35 s en charge)
  deep_hard_max_visits: 7000
  # Seuil quick : quels coups méritent une re-analyse deep
  deep_rerun_min_severity: mistake

thresholds:
  # Seuils calibrés 3 dan (perte en points)
  inaccuracy: 0.5
  mistake: 1.5
  blunder: 4.0
  mega_blunder: 8.0

kgs:
  base_url: https://www.gokgs.com
  files_url: https://files.gokgs.com
  request_delay_seconds: 1.5
  include_all_accounts: true
  board_size_filter: 19

paths:
  data_dir: data
  sgf_dir: data/sgf
  analysis_dir: data/analysis
  db_path: data/db/go_progress.db
  reports_dir: data/reports

dashboard:
  host: 127.0.0.1
  port: 8787
